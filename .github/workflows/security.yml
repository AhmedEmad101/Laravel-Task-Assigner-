name: Security Scan (SAST & DAST)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sast_scan:
    name: Run SAST (Code & Container Analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config=auto

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  dast_scan:
    name: Run DAST (OWASP ZAP Target Analysis)
    runs-on: ubuntu-latest
    needs: sast_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Laravel Environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
            echo "APP_NAME=TaskAssigner" >> .env
            echo "APP_ENV=local" >> .env
            echo "APP_KEY=" >> .env
            echo "APP_DEBUG=true" >> .env
            echo "APP_URL=http://localhost:9000" >> .env
          fi
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=mysql/g' .env 2>/dev/null || true
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=TaskAssigner/g' .env 2>/dev/null || true
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=/g' .env 2>/dev/null || true

      - name: Launch App for DAST Testing
        run: |
          docker compose up -d --build
          sleep 20
          docker compose exec -T server php artisan key:generate --force || true
          docker compose exec -T server php artisan migrate --force || true
          curl --retry 5 --retry-delay 3 --retry-connrefused -I http://localhost:9000

      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:9000'
          fail_action: false

      - name: Debug Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Cleanup Containers
        if: always()
        run: docker compose down -v
