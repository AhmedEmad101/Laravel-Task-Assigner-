services:
  server:
    build: .
    container_name: laravel_app
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - ai_service
    environment:
      - AI_SERVICE_URL=http://ai_service:8000

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "9000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: TaskAssigner
    volumes:
      - dbdata:/var/lib/mysql

  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: laravel_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface

volumes:
  dbdata:
  huggingface_cache: